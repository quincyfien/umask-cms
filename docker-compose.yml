services:
  postgres:
    image: postgres:16-alpine
    container_name: btrc_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: btrc_mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
